name: sniper_turk
description: Sniper Turk V1 - PCP and firearm ballistic companion
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  # M1 tools (versions from pub.dev 2026-10-03; Flutter 3.47.2 = Dart 3.13.2).
  geolocator: ^14.1.1
  sensors_plus: ^7.1.1
  flutter_compass: ^0.8.1
  camera: ^0.12.1
  # Sight Height "Galeriden seç" (iOS PHPicker, requestFullMetadata: false).
  image_picker: ^1.2.3
  http: ^1.6.0
  # Konum için mesafe: satellite map to pick shooter and target.
  flutter_map: ^8.2.1
  # Haritadan mesafe: Google Maps (hybrid) when the iOS key is configured.
  google_maps_flutter: ^2.10.0
  # DOPE kartı: PDF oluşturma ve paylaşma.
  pdf: ^3.11.0
  printing: ^5.13.0
  latlong2: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    # DejaVu Sans (Türkçe karakterler) for the DOPE card PDF.
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    # Line logo for the welcome page (light / dark theme).
    - assets/branding/logo_line.png
    - assets/branding/logo_line_dark.png
