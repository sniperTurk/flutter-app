name: sniper_turk
description: Sniper Turk V1 - PCP and firearm ballistic companion
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  # M1 tools (versions from pub.dev 2026-10-03; Flutter 3.47.2 = Dart 3.13.2).
  geolocator: ^14.1.1
  sensors_plus: ^7.1.1
  flutter_compass: ^0.8.1
  camera: ^0.12.1
  # Sight Height "Galeriden seç" (iOS PHPicker, requestFullMetadata: false).
  image_picker: ^1.2.3
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

  # Menzil design typefaces (SIL Open Font License 1.1; licence texts in
  # assets/fonts/). Static weights only: Flutter does not map FontWeight onto
  # variable-font axes automatically.
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.ttf
          weight: 700
