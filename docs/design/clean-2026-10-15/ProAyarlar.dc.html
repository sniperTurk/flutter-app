<style>
body{margin:0;background:#0B1620;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;color:#E7EFF3}
a{color:#4CC3E8}a:hover{color:#8ADCF2}
.scr{width:390px;height:1360px;background:#0B1620;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid #27425A}

.body{padding:16px 16px 100px;display:flex;flex-direction:column;gap:12px}
.card{background:#122330;border:1px solid #27425A;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#9CB1C0;min-height:24px}
.box{all:unset;height:48px;box-sizing:border-box;border:1px solid #27425A;border-radius:10px;background:#0B1620;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:16px;color:#E7EFF3;width:100%}
.box input{all:unset;flex:1;min-width:0;font-size:16px;color:#E7EFF3}
.u{font-size:13px;color:#9CB1C0;margin-left:6px}
.i{all:unset;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#9CB1C0;font-size:16px}
.btn{all:unset;height:48px;box-sizing:border-box;border-radius:12px;border:1px solid #3A5A75;color:#E7EFF3;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.done{background:#1F5F7A;border-color:#2E7FA0;color:#FFFFFF}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:center}
.date{font-size:13px;color:#9CB1C0}
.acc{all:unset;box-sizing:border-box;width:100%;height:60px;background:#122330;border:1px solid #27425A;border-radius:16px;padding:0 16px;display:flex;align-items:center;gap:8px}
.acc .n{flex:1;font-size:17px;font-weight:600;text-align:left}
.acc .s{font-size:13px;color:#9CB1C0}
.chev{color:#9CB1C0;font-size:14px;margin-left:4px}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #27425A;background:#0E1C27;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nb{all:unset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#9CB1C0}
.on{color:#F5B031}
</style>
