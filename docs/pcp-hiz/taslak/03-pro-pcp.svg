<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Oswald, 'Oswald', sans-serif" font-weight="400">
<style>@font-face{font-family:"Oswald";src:url("../../../assets/fonts/Oswald-Regular.ttf");font-weight:400;} text{font-family:"Oswald",sans-serif;font-weight:400;}</style>
