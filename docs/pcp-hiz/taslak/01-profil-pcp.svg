<text x="460.0" y="60.0" font-size="17" fill="#6A2C91" text-anchor="start">Taslak notları · Profil &gt; Mühimmat · yalnız PCP</text>
<circle cx="470.0" cy="87.0" r="10" fill="#6A2C91"/>
<text x="470.0" y="91.5" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="488.0" y="92.0" font-size="14.5" fill="#0F2230" text-anchor="start">Hız ölçüm basıncı | Regülatör basıncı</text>
<text x="488.0" y="111.0" font-size="13" fill="#465D6F" text-anchor="start">Yeni satır. Yalnız PCP profilde, Namlu çıkış hızının hemen altında.</text>
<text x="488.0" y="130.0" font-size="13" fill="#465D6F" text-anchor="start">Ateşli tüfekte aynı yerde bugünkü Barut sıcaklığı satırı durur.</text>
<text x="488.0" y="149.0" font-size="13" fill="#465D6F" text-anchor="start">İkisi de isteğe bağlı; boşsa hesap bugünkü gibi profildeki hızı kullanır.</text>
<circle cx="470.0" cy="168.0" r="10" fill="#6A2C91"/>
<text x="470.0" y="172.5" font-size="12" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="488.0" y="173.0" font-size="14.5" fill="#0F2230" text-anchor="start">Basınç–hız ölçümleri</text>
<text x="488.0" y="192.0" font-size="13" fill="#465D6F" text-anchor="start">İsteğe bağlı liste, en çok 10 satır; başta satır yok, yalnız düğme.</text>
<text x="488.0" y="211.0" font-size="13" fill="#465D6F" text-anchor="start">Ölçüm ekle'ye basınca bir satır açılır: Tüp basıncı | Namlu çıkış hızı.</text>
<text x="488.0" y="230.0" font-size="13" fill="#465D6F" text-anchor="start">× satırı siler. Ayrı aç/kapa düğmesi yok; veri girilince etkin.</text>
<text x="488.0" y="254.0" font-size="14.5" fill="#0F2230" text-anchor="start">ⓘ metinleri · öneri</text>
<text x="488.0" y="273.0" font-size="13" fill="#465D6F" text-anchor="start">Hız ölçüm basıncı: Namlu çıkış hızını kronografla ölçtüğünüz anda</text>
<text x="488.0" y="292.0" font-size="13" fill="#465D6F" text-anchor="start">manometrede okunan basınç, bar olarak. Manometre çoğunlukla tüpün</text>
<text x="488.0" y="311.0" font-size="13" fill="#465D6F" text-anchor="start">ucunda ya da dipçik altındadır. Örnek: 180 bar.</text>
<text x="488.0" y="330.0" font-size="13" fill="#465D6F" text-anchor="start"></text>
<text x="488.0" y="349.0" font-size="13" fill="#465D6F" text-anchor="start">Regülatör basıncı: Regülatörün ayarlı olduğu çıkış basıncı, bar olarak.</text>
<text x="488.0" y="368.0" font-size="13" fill="#465D6F" text-anchor="start">Kılavuzda veya regülatör manometresinde yazar. Örnek: 150 bar.</text>
<text x="488.0" y="387.0" font-size="13" fill="#465D6F" text-anchor="start">Regülatörsüz tüfekte boş bırakın.</text>
<text x="488.0" y="406.0" font-size="13" fill="#465D6F" text-anchor="start"></text>
<text x="488.0" y="425.0" font-size="13" fill="#465D6F" text-anchor="start">Basınç–hız ölçümleri: Tüp boşaldıkça hız değişir. Kronografla atış</text>
<text x="488.0" y="444.0" font-size="13" fill="#465D6F" text-anchor="start">yapın; birkaç atışta bir manometredeki basıncı ve o atışların</text>
<text x="488.0" y="463.0" font-size="13" fill="#465D6F" text-anchor="start">ortalama hızını yazın. Regülatörlü tüfekte yalnız regülatör</text>
<text x="488.0" y="482.0" font-size="13" fill="#465D6F" text-anchor="start">basıncının altındaki ölçümler girilir. Ölçüm yoksa boş bırakın.</text>
<text x="488.0" y="501.0" font-size="13" fill="#465D6F" text-anchor="start"></text>
<text x="488.0" y="520.0" font-size="13" fill="#465D6F" text-anchor="start">Tüp basıncı: Bu ölçümü yaptığınız anda manometredeki basınç.</text>
<text x="488.0" y="539.0" font-size="13" fill="#465D6F" text-anchor="start">Örnek: 120 bar.</text>
<text x="488.0" y="558.0" font-size="13" fill="#465D6F" text-anchor="start">Namlu çıkış hızı: O basınçta ölçtüğünüz atışların ortalaması, fps.</text>
<text x="488.0" y="577.0" font-size="13" fill="#465D6F" text-anchor="start">Örnek: 850 fps.</text>
<text x="488.0" y="601.0" font-size="14.5" fill="#0F2230" text-anchor="start">Kurallar</text>
<text x="488.0" y="620.0" font-size="13" fill="#465D6F" text-anchor="start">Kutu altında yardım yazısı yok; açıklamalar ⓘ içinde.</text>
<text x="488.0" y="639.0" font-size="13" fill="#465D6F" text-anchor="start">Kutularda örnek değer yok; liste kutuları Seçiniz ile başlar.</text>
<text x="488.0" y="658.0" font-size="13" fill="#465D6F" text-anchor="start">Ateşli tüfek profilinde bu alanlar hiç oluşturulmaz.</text>
</svg>
