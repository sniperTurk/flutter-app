name: CI diagnostics (never a release artifact)

# Runs the real Flutter 3.47.2 chain WITHOUT stopping at the first failure and
# pushes every output (versions, format patch, analyzer log, test log, resolver
# lockfile) to the branch `ci/diagnostics`, so real compiler/analyzer/test
# results can be read from git. Nothing produced here is a verified release
# artifact: the lockfile here is UNVERIFIED until bootstrap-lockfile passes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Run real chain (keep going on failure)
        shell: bash
        run: |
          set +e
          mkdir -p ci-logs
          { flutter --version; dart --version; } > ci-logs/versions.txt 2>&1 || true
          python3 tools/verify_flutter_toolchain.py > ci-logs/toolchain.txt 2>&1 || true
          rm -f pubspec.lock
          flutter pub get > ci-logs/pub-get.log 2>&1; echo "pub get exit: $?" >> ci-logs/status.txt
          cp pubspec.lock ci-logs/pubspec.lock.UNVERIFIED || true
          dart fix --apply --code=curly_braces_in_flow_control_structures > ci-logs/dart-fix.log 2>&1; echo "dart fix exit: $?" >> ci-logs/status.txt
          dart format --output=none --set-exit-if-changed lib test integration_test tools > ci-logs/format-check.log 2>&1; echo "format check exit: $?" >> ci-logs/status.txt
          dart format lib test integration_test tools > ci-logs/format-apply.log 2>&1 || true
          git diff -- lib test integration_test tools > ci-logs/dart-format.patch || true
          flutter analyze --fatal-infos --fatal-warnings > ci-logs/analyze.log 2>&1; echo "analyze exit: $?" >> ci-logs/status.txt
          flutter test --reporter=expanded > ci-logs/test.log 2>&1; echo "test exit: $?" >> ci-logs/status.txt
          cat ci-logs/status.txt

      - name: Independent reference validator chain (diagnostic log only)
        shell: bash
        run: |
          set +e
          {
            python3 tools/bootstrap_reference_validator.py; echo "bootstrap exit: $?"
            .validator_venv/bin/python tools/generate_reference_vectors.py; echo "generate exit: $?"
            ls -la validation/ || true
            python3 tools/validate_py_ballisticcalc_fixture.py validation/py_ballisticcalc_vectors.json; echo "fixture validate exit: $?"
            python3 --version
          } > ci-logs/validator.log 2>&1
          exit 0

      # Reachable copy of a lockfile, ONLY when this exact run passed format,
      # analyze and tests (all exit 0) with it, using the same provenance tools
      # as bootstrap-lockfile. Review, then commit to main.
      - name: Publish lockfile to ci/lockfile (only if every check passed)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(grep -c ' exit: 0$' ci-logs/status.txt)" != "5" ]; then
            echo "not all checks passed; no lockfile published"; exit 0
          fi
          python3 tools/write_lockfile_provenance.py --flutter-version 3.47.2
          python3 tools/verify_lockfile_provenance.py
          shasum -a 256 pubspec.lock lockfile-provenance.txt > lockfile-sha256.txt
          mkdir -p /tmp/lock && cp pubspec.lock lockfile-provenance.txt lockfile-sha256.txt /tmp/lock/
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git stash -u -q || true
          git checkout -q --orphan ci/lockfile
          git rm -rf -q . || true
          cp /tmp/lock/* .
          git add pubspec.lock lockfile-provenance.txt lockfile-sha256.txt
          git commit -q -m "lockfile from run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}; format+analyze+test all exit 0"
          git push -f origin ci/lockfile
          git checkout -q -f "$GITHUB_SHA"
          git stash pop -q || true

      - name: Push diagnostics to branch
        if: always()
        shell: bash
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git checkout -b ci/diagnostics
          git add -A lib test integration_test tools ci-logs
          git commit -m "ci diagnostics: real Flutter 3.47.2 output (UNVERIFIED)" || true
          git push -f origin ci/diagnostics
