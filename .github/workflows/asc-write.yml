name: ASC listing write (ops only)
on:
  push:
    branches: [ops/asc-write]
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch screenshots
        run: |
          git fetch -q origin ci/store-screens
          mkdir -p shots
          for f in 1-hedef 2-tablo 3-pro 4-hava 5-pro-ruzgar 6-araclar; do git show "FETCH_HEAD:store-screens/$f.png" > "shots/$f.png"; done
          ls -la shots
      - name: Write listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 ops/asc_write.py || true
      - name: Publish log
        if: always()
        run: |
          git config user.name asc-write; git config user.email asc-write@users.noreply.github.com
          cp ci-logs/write.log /tmp/write.log || echo "no log" > /tmp/write.log
          git checkout -q --orphan ci/asc-write; git rm -rqf . ; mkdir -p ci-logs; cp /tmp/write.log ci-logs/
          git add ci-logs; git commit -qm "asc write ${GITHUB_RUN_ID}"; git push -qf origin ci/asc-write
