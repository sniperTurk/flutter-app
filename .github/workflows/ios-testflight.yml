name: iOS TestFlight

# Manual, owner-triggered release upload. Signs with Apple cloud-managed
# signing through an App Store Connect API key and uploads the build to
# TestFlight. Never runs automatically and never fakes success: any missing
# secret, signing failure or upload failure fails the job.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and upload'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Require signing secrets
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -n "${!n}" ] || { echo "Missing required secret/variable: $n" >&2; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enforce closed G1/G7 production gate
        run: python3 tools/verify_production_gate.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Enforce pinned Flutter release toolchain
        run: python3 tools/verify_flutter_toolchain.py

      - name: Resolve dependencies without lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(shasum -a 256 pubspec.lock | awk '{print $1}')"
          flutter pub get
          AFTER="$(shasum -a 256 pubspec.lock | awk '{print $1}')"
          [[ "$BEFORE" == "$AFTER" ]] || { echo "pubspec.lock drift" >&2; exit 1; }

      - name: Generate and verify pinned iOS scaffold
        shell: bash
        env:
          SNIPER_TURK_IOS_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: tools/bootstrap_ios_scaffold.sh

      - name: Enforce App Store source preflight
        shell: bash
        env:
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: python3 tools/app_store_preflight.py --privacy-url "$PRIVACY_POLICY_URL"

      - name: Require MET Norway contact
        shell: bash
        env:
          METNO_CONTACT: ${{ vars.METNO_CONTACT }}
        run: python3 tools/validate_metno_contact.py "$METNO_CONTACT"

      - name: Install App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          head -n 1 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" | grep -q 'BEGIN PRIVATE KEY' || {
            echo "ASC_KEY_P8 does not look like a .p8 private key" >&2; exit 1; }

      - name: Check App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>&1 | tail -1 || true
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error
          import jwt
          kid = os.environ["ASC_KEY_ID"]
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "asc", f"AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
                            "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=5",
                                       headers={"Authorization": f"Bearer {tok}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
                  names = [a["attributes"]["bundleId"] for a in d.get("data", [])]
                  print(f"::notice title=ASC API key::HTTP {r.status}; apps: {names}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()[:300].replace("\n", " ")
              print(f"::error title=ASC API key::HTTP {e.code}: {body}")
              raise SystemExit(1)
          PY

      - name: Build Flutter release (unsigned, prepares Xcode config)
        shell: bash
        env:
          METNO_CONTACT: ${{ vars.METNO_CONTACT }}
        run: |
          set -euo pipefail
          # Each TestFlight upload needs a unique build number.
          flutter build ios --release --no-codesign \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=METNO_CONTACT="$METNO_CONTACT"

      - name: Archive with cloud-managed signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          mkdir -p build/ios/signed
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/signed/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic 2>&1 | tee build/ios/signed/archive.log

      - name: Export and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          mkdir -p build/ios/signed
          python3 - <<'PY'
          import os, plistlib
          with open("build/ios/signed/ExportOptions.plist", "wb") as f:
              plistlib.dump({
                  "destination": "upload",
                  "method": "app-store-connect",
                  "signingStyle": "automatic",
                  "stripSwiftSymbols": True,
                  "teamID": os.environ["TEAM_ID"],
                  "uploadSymbols": True,
                  "manageAppVersionAndBuildNumber": False,
              }, f)
          PY
          xcodebuild -exportArchive \
            -archivePath build/ios/signed/Runner.xcarchive \
            -exportPath build/ios/signed/export \
            -exportOptionsPlist build/ios/signed/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/ios/signed/export.log

      - name: Surface xcodebuild errors
        if: failure()
        shell: bash
        run: |
          for f in build/ios/signed/archive.log build/ios/signed/export.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Error Domain|requires a provisioning|No profile|No signing|Provisioning|forbidden|not permitted|does not have permission" "$f" | sort -u | head -12 | while IFS= read -r line; do
              echo "::error title=$(basename "$f")::${line:0:400}"
            done
          done

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
