name: One-off dart format fix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to format and push to'
        required: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Record toolchain
        run: |
          flutter --version
          dart --version

      - name: Apply dart format
        run: dart format lib test integration_test tools

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -A
          git commit -m "Apply dart format (CI-generated, one-off format-fix workflow)"
          git push origin HEAD:${{ github.event.inputs.branch }}
