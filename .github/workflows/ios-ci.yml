name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.11'

      - name: Validate complete Python tools tree
        # Compile every Python source under tools/. A hand-maintained py_compile
        # list can silently miss newly added release/preflight helpers.
        run: python3 -m compileall -q tools

      - name: Run dependency-free Dart source hygiene
        run: python3 tools/offline_dart_lint.py

      - name: Run complete offline Python regression suite
        # Discovery is intentional: every tools/test_*.py regression guard must
        # enter the production gate automatically instead of relying on a
        # hand-maintained module list that can silently omit new tests.
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Enforce closed G1/G7 production gate
        run: python3 tools/verify_production_gate.py

      # Reject an unreproducible release before spending time installing the
      # Flutter SDK. The lockfile must be generated by the pinned toolchain and
      # committed; CI must never synthesize release dependency resolution.
      - name: Require committed dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pubspec.lock || {
            echo "pubspec.lock is missing or empty. Generate it with pinned Flutter 3.47.2 and commit it before release CI." >&2
            exit 1
          }

      # Validate provenance before downloading/installing Flutter. A non-empty
      # lockfile alone does not prove that it was resolved by the pinned release
      # toolchain or against the current pubspec.
      - name: Verify committed dependency lockfile provenance
        run: python3 tools/verify_lockfile_provenance.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Enforce pinned Flutter release toolchain
        run: python3 tools/verify_flutter_toolchain.py

      - name: Record toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          python3 --version

      - name: Bootstrap pinned independent ballistic validator
        run: python3 tools/bootstrap_reference_validator.py

      - name: Generate independent G1/G7 reference vectors
        run: |
          .validator_venv/bin/python tools/generate_reference_vectors.py
          test -s validation/py_ballisticcalc_vectors.json
          python3 tools/validate_py_ballisticcalc_fixture.py validation/py_ballisticcalc_vectors.json

      - name: Upload independent reference vectors
        uses: actions/upload-artifact@v7
        with:
          name: g1-g7-reference-vectors
          path: validation/py_ballisticcalc_vectors.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve dependencies without lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_LOCK_SHA="$(shasum -a 256 pubspec.lock | awk '{print $1}')"
          flutter pub get
          AFTER_LOCK_SHA="$(shasum -a 256 pubspec.lock | awk '{print $1}')"
          [[ "$BEFORE_LOCK_SHA" == "$AFTER_LOCK_SHA" ]] || {
            echo "flutter pub get changed pubspec.lock. Commit the resolver output produced by pinned Flutter 3.47.2 before release CI." >&2
            git --no-pager diff -- pubspec.lock || true
            exit 1
          }

      # dart run needs the package configuration created by flutter pub get.
      # Keep this after dependency resolution so a missing .dart_tool directory
      # cannot make an otherwise valid reference comparison fail spuriously.
      - name: Compare Dart G1/G7 solver with independent vectors
        run: dart run tools/compare_reference_vectors.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tools

      - name: Reject generated and temporary source artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Release source archives must stay reproducible and reviewable. Python
          # bytecode/caches and editor backup files are generated artifacts, not
          # source. Check the whole repository (excluding Git internals) so tools/
          # cannot silently reintroduce the __pycache__ files removed from release
          # packages.
          # Inspect committed/tracked source only. Earlier Python validation may
          # legitimately create local __pycache__ files; those must not make CI
          # fail unless they were actually committed to the repository.
          BAD_ARTIFACTS="$(
            git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$|\.tmp$|\.bak$|~$' || true
          )"
          if [[ -n "$BAD_ARTIFACTS" ]]; then
            printf 'Generated/temporary artifact committed to source:\n%s\n' "$BAD_ARTIFACTS" >&2
            exit 1
          fi

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --coverage --reporter=expanded

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate and verify pinned iOS scaffold
        shell: bash
        env:
          # Optional repository variable. When configured by the owner, the
          # deterministic v309 signing configurator applies the real Apple Team
          # to every generated Automatic signing build setting. An empty value
          # deliberately leaves the archive unsigned and does not fake signing.
          SNIPER_TURK_IOS_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: tools/bootstrap_ios_scaffold.sh

      - name: Enforce App Store source preflight
        shell: bash
        env:
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          set -euo pipefail
          python3 tools/app_store_preflight.py --privacy-url "$PRIVACY_POLICY_URL"

      - name: Verify live privacy policy page
        shell: bash
        env:
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          set -euo pipefail
          python3 tools/verify_privacy_policy_url.py --url "$PRIVACY_POLICY_URL"

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug

      - name: Boot iOS Simulator and run launch smoke test
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 tools/select_ios_simulator.py)"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b

          # The smoke contract starts from a clean install. GitHub-hosted
          # simulators can retain an app container across repeated installs in
          # the same job, and `simctl install` does not promise to erase that
          # container. Remove any previous Runner data before both the raw app
          # launch and the Flutter integration-test phase so persisted profiles
          # cannot make a rerun pass/fail for the wrong reason. `uninstall` is
          # intentionally tolerant because a genuinely clean simulator has no
          # matching bundle yet.
          BUNDLE_ID="com.sniperturk.sniperTurk"
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" 2>/dev/null || true

          # First exercise the exact .app produced by the preceding Flutter
          # simulator build. Installing and launching that bundle catches
          # packaging/Info.plist/runtime failures that a source-level
          # integration-test invocation alone can miss.
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          test -d "$APP_PATH"
          BUILT_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test -n "$BUILT_BUNDLE_ID"
          [[ "$BUILT_BUNDLE_ID" == "$BUNDLE_ID" ]] || {
            echo "Unexpected simulator bundle identifier: $BUILT_BUNDLE_ID" >&2
            exit 1
          }
          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID")"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -Eq ":[[:space:]]*[0-9]+$"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID"

          # Then run the Flutter integration smoke test for production route
          # navigation and plugin/persistence wiring. The preceding uninstall is
          # strict here: we just installed the bundle, so failure to remove it
          # means clean-install isolation is not proven and CI must stop.
          flutter devices
          flutter test integration_test/app_launch_test.dart -d "$UDID" --reporter=expanded

      # The weather adapter refuses to call api.met.no while the build carries
      # the CONTACT_REQUIRED placeholder. A release without a real contact would
      # ship Hava & Rüzgâr permanently disabled, so require it here. The value
      # comes from the owner's repository variable; it is never invented.
      - name: Require MET Norway contact for release builds
        shell: bash
        env:
          METNO_CONTACT: ${{ vars.METNO_CONTACT }}
        run: python3 tools/validate_metno_contact.py "$METNO_CONTACT"

      - name: Build unsigned iOS device app
        env:
          METNO_CONTACT: ${{ vars.METNO_CONTACT }}
        run: flutter build ios --release --no-codesign --dart-define=METNO_CONTACT="$METNO_CONTACT"

      # Build the archive container used by the App Store pipeline as a separate
      # gate. This intentionally remains unsigned: signing/export requires the
      # owner's Apple distribution credentials and must not be faked in CI.
      - name: Build unsigned App Store archive
        shell: bash
        env:
          METNO_CONTACT: ${{ vars.METNO_CONTACT }}
        run: |
          set -euo pipefail
          flutter build ipa --release --no-codesign --dart-define=METNO_CONTACT="$METNO_CONTACT"
          ARCHIVE_INFO="build/ios/archive/Runner.xcarchive/Info.plist"
          APP_INFO="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          test -s "$ARCHIVE_INFO"
          test -s "$APP_INFO"

          # Derive the expected version/build from the same pubspec that Flutter
          # consumes. Hard-coding these values here can let CI reject a valid
          # version bump or, worse, validate stale release metadata.
          PUBSPEC_VERSION="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml)"
          [[ "$PUBSPEC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]] || {
            echo "Invalid pubspec release version: $PUBSPEC_VERSION" >&2
            exit 1
          }
          EXPECTED_MARKETING_VERSION="${PUBSPEC_VERSION%%+*}"
          EXPECTED_BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          EXPECTED_DISPLAY_NAME="SNIPER TÜRK"

          ARCHIVE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_INFO")"
          ARCHIVE_MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          ARCHIVE_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          ARCHIVE_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")"
          ARCHIVE_EXPORT_COMPLIANCE="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_INFO" | tr '[:upper:]' '[:lower:]')"
          ARCHIVE_MINIMUM_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_INFO")"

          [[ "$ARCHIVE_BUNDLE_ID" == "com.sniperturk.sniperTurk" ]] || {
            echo "Unexpected archive bundle identifier: $ARCHIVE_BUNDLE_ID" >&2
            exit 1
          }
          [[ "$ARCHIVE_MARKETING_VERSION" == "$EXPECTED_MARKETING_VERSION" ]] || {
            echo "Unexpected archive marketing version: $ARCHIVE_MARKETING_VERSION" >&2
            exit 1
          }
          [[ "$ARCHIVE_BUILD_NUMBER" == "$EXPECTED_BUILD_NUMBER" ]] || {
            echo "Unexpected archive build number: $ARCHIVE_BUILD_NUMBER" >&2
            exit 1
          }
          [[ "$ARCHIVE_DISPLAY_NAME" == "$EXPECTED_DISPLAY_NAME" ]] || {
            echo "Unexpected archive display name: $ARCHIVE_DISPLAY_NAME" >&2
            exit 1
          }
          [[ "$ARCHIVE_EXPORT_COMPLIANCE" == "false" ]] || {
            echo "Unexpected archive export-compliance declaration: $ARCHIVE_EXPORT_COMPLIANCE" >&2
            exit 1
          }
          python3 - "$ARCHIVE_MINIMUM_OS" <<'PYMINIOS'
          import re, sys
          value = sys.argv[1]
          m = re.fullmatch(r"(\d+)(?:\.(\d+))?", value)
          if not m or (int(m.group(1)), int(m.group(2) or 0)) < (15, 0):
              raise SystemExit(f"Unexpected archive MinimumOSVersion: {value}; expected iOS 15.0 or newer")
          PYMINIOS

      - name: Verify archive is deliberately unsigned
        run: python3 tools/verify_ios_archive_signing_state.py --archive build/ios/archive/Runner.xcarchive --bundle-id com.sniperturk.sniperTurk

      - name: Verify built iOS privacy manifests
        # Inspect the archive that would enter the signing/export pipeline.
        # Source/package assumptions are insufficient: required-reason metadata
        # must actually survive into the built application/framework bundle.
        run: python3 tools/verify_ios_privacy_manifests.py --archive build/ios/archive/Runner.xcarchive --require-runner-manifest

      # Preserve the exact archive that passed metadata validation. This is not
      # a signed App Store deliverable, but it makes the CI result auditable and
      # gives the owner a concrete artifact for later signing/export diagnostics.
      - name: Generate App Store export options when signing is configured
        if: ${{ vars.IOS_DEVELOPMENT_TEAM != '' }}
        env:
          SNIPER_TURK_IOS_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
        run: python3 tools/generate_ios_export_options.py

      - name: Upload validated unsigned App Store archive
        uses: actions/upload-artifact@v7
        with:
          name: sniper-turk-ios-unsigned-xcarchive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-diagnostics
          path: |
            build/ios
            .dart_tool
          if-no-files-found: ignore
          retention-days: 7
