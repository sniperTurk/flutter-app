name: One-off dart format diagnostic

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to diagnose'
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Record toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Diagnose formatting and analysis
        id: diag
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test integration_test tools > /tmp/fmt_check.txt 2>&1
          FMT_EXIT=$?
          flutter analyze --fatal-infos --fatal-warnings > /tmp/analyze_check.txt 2>&1
          ANALYZE_EXIT=$?
          set -e
          {
            echo "fmt_exit=$FMT_EXIT"
            echo "analyze_exit=$ANALYZE_EXIT"
          } >> "$GITHUB_OUTPUT"

      - name: Post result as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          {
            echo "**One-off format+analyze diagnostic** on \`${{ github.event.inputs.branch }}\`"
            echo
            echo "format exit: ${{ steps.diag.outputs.fmt_exit }} | analyze exit: ${{ steps.diag.outputs.analyze_exit }}"
            echo
            echo "<details><summary>dart format output</summary>"
            echo
            echo '```'
            cat /tmp/fmt_check.txt
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>flutter analyze output</summary>"
            echo
            echo '```'
            cat /tmp/analyze_check.txt
            echo '```'
            echo "</details>"
          } > "$BODY_FILE"
          gh pr comment 3 --repo sniperTurk/flutter-app --body-file "$BODY_FILE"
