name: Store screenshots (ops only)
on:
  push:
    branches: [ops/store-screens]
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Render on simulator
        shell: bash
        run: |
          set +e
          mkdir -p store-screens
          flutter pub get
          tools/bootstrap_ios_scaffold.sh > store-screens/bootstrap.log 2>&1
          cp ops/store_shots_it.dart integration_test/store_shots_it.dart
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,v in d.items() if 'iOS' in r for x in v if 'Pro Max' in x['name']]
          c.sort(key=lambda t:(t[0],t[1]['name']))
          print(c[-1][1]['udid']); print(c[-1][1]['name'],c[-1][0],file=sys.stderr)")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork 5g --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          (
            for t in $(seq 1 1800); do
              C=$(xcrun simctl get_app_container "$UDID" com.sniperturk.sniperTurk data 2>/dev/null)
              if [ -n "$C" ] && [ -d "$C/tmp" ]; then
                for f in "$C"/tmp/store_shot_*; do
                  [ -e "$f" ] || continue
                  n="${f##*store_shot_}"
                  sleep 0.5
                  xcrun simctl io "$UDID" screenshot "store-screens/$n.png" && echo "shot $n" >> store-screens/shots.log
                  rm -f "$f"
                done
              fi
              sleep 0.5
            done
          ) &
          POLL=$!
          flutter test integration_test/store_shots_it.dart -d "$UDID" --reporter=expanded > store-screens/run.log 2>&1
          kill $POLL 2>/dev/null
          cat store-screens/shots.log
          tail -40 store-screens/run.log
      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name store-screens; git config user.email store-screens@users.noreply.github.com
          rm -rf /tmp/ss; cp -r store-screens /tmp/ss
          git checkout -q --orphan ci/store-screens; git rm -rqf . ; cp -r /tmp/ss store-screens
          git add store-screens; git commit -qm "store screens ${GITHUB_RUN_ID}"; git push -qf origin ci/store-screens
